name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the editor and run the checks
        run: make check

      - name: Rebuild with -Werror and run the checks again
        run: |
          make clean
          make check CFLAGS="-Wall -Wextra -Wconversion -std=c11 -I. -Werror"

      - name: Verify a staged install
        run: |
          make install DESTDIR="$PWD/stage"
          test -x stage/usr/local/bin/vted
          test -f stage/usr/local/share/man/man1/vted.1

  sanitizers:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build and run the checks under ASan/UBSan
        run: |
          make clean
          make check CFLAGS="-Wall -Wextra -Wconversion -std=c11 -I. -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
