name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the editor
        run: make

      - name: Rebuild with -Werror
        run: |
          make clean
          make CFLAGS="-Wall -Wextra -Wconversion -std=c11 -I. -Werror"

      - name: Run the unit tests
        run: make test CFLAGS="-Wall -Wextra -Wconversion -std=c11 -I. -Werror"

      - name: Verify a staged install
        run: |
          make install DESTDIR="$PWD/stage"
          test -x stage/usr/local/bin/vted
          test -f stage/usr/local/share/man/man1/vted.1
